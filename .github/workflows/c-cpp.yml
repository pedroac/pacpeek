name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config gettext libwayland-dev libwayland-bin \
          wayland-protocols libcairo2-dev libfreetype-dev libharfbuzz-dev libfribidi-dev
    - name: make
      run: make
    - name: make (English-only, I18N=0)
      run: make clean && make I18N=0
    - name: unit tests
      run: make clean && make test
